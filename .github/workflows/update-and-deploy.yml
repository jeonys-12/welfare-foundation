name: Update news and deploy Pages

on:
  schedule:
    # GitHub Actions scheduled runs can be delayed around the top of the hour.
    # Start at 06:30 KST so collection and deployment can normally finish by 07:00.
    - cron: "30 21 * * *" # 06:30 Asia/Seoul (UTC+9)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/news.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: welfare-foundation-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate collector
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/collect_news.py
          python - <<'PY'
          from datetime import datetime, timezone
          import scripts.collect_news as collector

          assert collector.keep_recent_disasters([
              {
                  "category": "disaster",
                  "source": "USGS",
                  "final_source": "USGS",
                  "url": "https://earthquake.usgs.gov/example",
                  "published_at": "2026-07-22T00:00:00+00:00",
              }
          ]) == []

          assert collector.parse_gdacs_rss(
              b"""<rss xmlns:gdacs="http://www.gdacs.org"><channel><item>
              <title>Flood alert</title><link>https://www.gdacs.org/example</link>
              <description>flood emergency</description>
              <pubDate>Wed, 22 Jul 2026 00:00:00 GMT</pubDate>
              <gdacs:alertscore>0.5</gdacs:alertscore>
              <gdacs:alertlevel>Green</gdacs:alertlevel>
              </item></channel></rss>"""
          ) == []

          assert collector.parse_kbs_date(
              "3일 전 방송",
              now=datetime(2026, 7, 28, tzinfo=timezone.utc),
          ) == "2026-07-25T00:00:00+00:00"

          kbs_api = b"""{
            "status": 200,
            "data": [
              {
                "program_code": "T2014-0877",
                "program_id": "PS-2026122475-01-000",
                "program_number": "568",
                "program_date": "20260725",
                "descriptive_video_service_yn": "N",
                "target_url": "/index.html?source=episode&program_code=T2014-0877&program_id=PS-2026122475-01-000&section_code=05",
                "description": "[\uc6a9\uc8fc \uc528\uc758 \uace0\uad70\ubd84\ud22c \uc721\uc544\uc77c\uae30] \uc544\ube60\uc640 \ub450 \uc544\ub4e4\uc758 \uc774\uc57c\uae30"
              },
              {
                "program_code": "T2014-0877",
                "program_id": "PS-OLD-01-000D",
                "program_number": "543",
                "program_date": "20260728",
                "descriptive_video_service_yn": "Y",
                "target_url": "/index.html?program_code=T2014-0877&program_id=PS-OLD-01-000D",
                "description": "[\ud574\uc124\ubc29\uc1a1] \uae30\uc874 \ud68c\ucc28"
              }
            ]
          }"""
          api_items = collector.parse_kbs_api(
              kbs_api,
              now=datetime(2026, 7, 28, tzinfo=timezone.utc),
          )
          assert len(api_items) == 1
          assert api_items[0]["title"] == "동행 568회 용주 씨의 고군분투 육아일기"
          assert api_items[0]["published_at"] == "2026-07-25T00:00:00+00:00"
          assert "&section_code=05" in api_items[0]["url"]

          replay_copy = dict(api_items[0])
          replay_copy.update({
              "published_at": "2026-07-28T00:00:00+00:00",
              "priority": 1,
              "summary": "보조 검색 경로에서 재노출된 같은 회차",
          })
          deduped_kbs = collector.deduplicate_news_events([replay_copy, api_items[0]])
          assert len(deduped_kbs) == 1
          assert deduped_kbs[0]["published_at"] == "2026-07-25T00:00:00+00:00"

          kbs_html = b"""<a href="https://vod.kbs.co.kr/m/index.html?program_code=T2014-0877&amp;program_id=PS-2026122475-01-000">
          <strong>3\xec\x9d\xbc \xec\xa0\x84 \xeb\xb0\xa9\xec\x86\xa1</strong>
          <p>[\xec\x9a\xa9\xec\xa3\xbc \xec\x94\xa8\xec\x9d\x98 \xea\xb3\xa0\xea\xb5\xb0\xeb\xb6\x84\xed\x88\xac \xec\x9c\xa1\xec\x95\x84\xec\x9d\xbc\xea\xb8\xb0]</p>
          </a>"""
          kbs_items = collector.parse_kbs_html(
              kbs_html,
              collector.KBS_PROGRAM_URL,
              "KBS 동행 공식 프로그램",
          )
          assert len(kbs_items) == 1
          assert kbs_items[0]["title"] == "동행 용주 씨의 고군분투 육아일기"
          print("collector validation passed")
          PY
          python -m unittest discover -s tests -v

      - name: Collect and analyze public-interest news
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-nano' }}
          OPENAI_MAX_ITEMS: ${{ vars.OPENAI_MAX_ITEMS || '12' }}
        run: |
          set -euo pipefail
          timeout 35m python scripts/collect_news.py
          python -m json.tool data/news.json > /dev/null

      # A push-triggered run deploys the freshly generated artifact only. Committing from
      # that same run races with subsequent source edits and causes non-fast-forward failures.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/news.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Update monitoring data"
          git push

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
